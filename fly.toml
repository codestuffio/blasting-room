# Fly.io config. Deploy with: fly launch --no-deploy && fly secrets set ANTHROPIC_API_KEY=... QLOO_API_KEY=... && fly deploy
app = "blasting-room"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
